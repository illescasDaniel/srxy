[project]
name = "srxy"
version = "1.6.6"
description = "Find files by what you mean — from the terminal or Python."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
	"cryptography>=44.0",
	"exifread>=3.5",
	"jellyfish>=1.2",
	"mutagen>=1.48",
	"openpyxl>=3.1",
	"pillow>=12.3",
	"pillow-heif>=1.4",
	"pypdf>=6.15",
	"pytesseract>=0.3",
	"PySide6>=6.6",
	"python-docx>=1.2",
	"python-pptx>=1.0",
	"rapidfuzz>=3.14",
	"textual>=3.0",
	"wordfreq>=3.1",
]

[project.optional-dependencies]
# Text + image semantic search (sentence-transformers → PyTorch, CLIP, MiniLM).
semantic = [
	"faster-whisper>=1.2",
	"nvidia-cublas-cu12; platform_system == 'Linux' or platform_system == 'Windows'",
	"rawpy>=0.27",
	"sentence-transformers>=5.6",
]
windows = [
	"pywin32>=312",
]

[dependency-groups]
dev = [
	"basedpyright>=1.39",
	"pip-audit>=2.10",
	"pytest>=9.1",
	"pytest-cov>=7.1",
	"pytest-qt>=4.4",
	"pytest-testmon>=2.2",
	"pytest-timeout>=2.4",
	"pytest-xdist>=3.6",
	"ruff>=0.15",
	"taskipy>=1.14",
	"pngquant-cli>=3.0.3",
]
uploader = [
	"twine>=6.2",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[project.scripts]
srxy = "srxy.__main__:main"
srxy-installer = "srxy.adapters.inbound.installer.__main__:main"
srxy-installer-online = "srxy.adapters.inbound.installer_online.__main__:main"

# tests/ (including tests/fixtures/file_search/) are dev-only and not packaged in the wheel.

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -rs"
pythonpath = ["."]
qt_api = "pyside6"
# Fail hung tests instead of blocking the gate forever.
# Use thread method: signal alarms crash xdist/Qt workers ("node down").
timeout = 60
timeout_method = "thread"
filterwarnings = [
	"ignore:.*BPE.__init__ will not create from files anymore:DeprecationWarning",
]
markers = [
	"unit: fast isolated tests",
	"integration: tests using real models and fixture datasets",
	"tui: Textual TUI display and interaction tests",
	"gui: PySide6 GUI display and interaction tests",
	"ocr: tests requiring a real OCR backend",
	"linux_xattr: tests that require Linux extended attribute support",
	"macos_finder: tests that require writable macOS Finder tag extended attributes",
	"windows_tags: tests that require Windows Explorer tag support via pywin32",
	"transcribe: tests requiring faster-whisper, transformers, and ffmpeg",
	"semantic: tests requiring uv tool install 'srxy[semantic]' (torch, sentence-transformers, etc.)",
	"integration_full: extended integration tests using committed binary fixtures from tests/fixtures/file_search/",
	"transcribe_device_matrix: parametrized transcribe device matrix (CUDA only when available; use --integration-test-cpu to force CPU too)",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.format]
indent-style = "tab"

[tool.ruff.lint]
select = ["F", "I", "E", "S", "B"]
fixable = ["ALL"]
ignore = ["E501"]

[tool.ruff.lint.isort]
combine-as-imports = true
lines-after-imports = 2

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["S603", "S607"]
"tests/**" = ["S101"]
"tests/integration/test_file_search_fixtures.py" = ["S603", "S607"]
"tests/tui/test_qa_integration.py" = ["S108"]

[tool.basedpyright]
typeCheckingMode = "strict"
include = ["src", "tests"]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
reportMissingTypeStubs = false
reportMissingModuleSource = false
reportUnknownMemberType = false
reportUnknownLambdaType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportAttributeAccessIssue = false
executionEnvironments = [
	{ root = "src/srxy/adapters/outbound/metadata/windows_metadata.py", reportMissingModuleSource = "none", reportMissingImports = "none" },
	{ root = "src/srxy/adapters/outbound/models/device.py", reportMissingImports = "none" },
	{ root = "src/srxy/adapters/outbound/semantic/semantic_image.py", reportMissingImports = "none" },
	{ root = "src/srxy/application/matching/semantic.py", reportMissingImports = "none" },
	{ root = "tests/unit/test_semantic_cache.py", reportMissingImports = "none" },
	{ root = "tests/unit/test_windows_metadata.py", reportPrivateUsage = "none" },
	{ root = "src" },
	{ root = "tests", extraPaths = ["src", "."] },
]

[tool.coverage.run]
source = ["srxy"]
omit = ["tests/*"]

[tool.taskipy.tasks]
cli = { cmd = "uv run srxy --cli", help = "launch plain CLI (pass query/path/flags after --)" }
tui = { cmd = "uv run srxy --tui", help = "launch Textual TUI (pass query/path/flags after --)" }
gui = { cmd = "uv run srxy", help = "launch GUI (pass query/path/flags after --)" }
gui-bare = { cmd = "./scripts/gui-bare.sh", help = "GUI from core-only .venv-bare (no semantic extras; --recreate to rebuild)" }
installer = { cmd = "uv run srxy-installer", help = "launch desktop install/uninstall wizard" }
installer-online = { cmd = "uv run srxy-installer-online", help = "launch one-click online installer (localhost browser UI)" }
installer-online-local = { cmd = "./scripts/installer-online-local.sh", help = "build local wheel + launch online installer (SRXY_INSTALL_WHEEL; --no-build to reuse)" }
installer-macos = { cmd = "uv run srxy-installer", help = "launch macOS offline installer wizard (.app parity)" }
installer-online-macos = { cmd = "uv run srxy-installer-online", help = "launch macOS online installer flow (localhost browser UI)" }
installer-online-local-macos = { cmd = "./scripts/installer-online-local.sh", help = "build local wheel + launch macOS online installer flow (SRXY_INSTALL_WHEEL)" }
build-appimage = { cmd = "./packaging/linux-appimage/build.sh", help = "build offline Linux installer AppImage into dist/" }
build-appimage-online = { cmd = "./packaging/linux-appimage/build-online.sh", help = "build online Linux installer AppImage into dist/" }
build-macos-installer-offline = { cmd = "./packaging/macos/build-offline.sh", help = "build offline macOS installer .app wrapper into dist/ (unsigned, matches CI)" }
build-macos-installer-online = { cmd = "./packaging/macos/build-online.sh", help = "build online macOS installer .app wrapper into dist/ (unsigned, matches CI)" }
build-macos-installer-offline-signed = { cmd = "./packaging/macos/build-offline-signed.sh", help = "build + locally sign/notarize/staple the offline macOS installer (see packaging/macos/signing.env.example)" }
build-macos-installer-online-signed = { cmd = "./packaging/macos/build-online-signed.sh", help = "build + locally sign/notarize/staple the online macOS installer (see packaging/macos/signing.env.example)" }
build-windows-installer-offline = { cmd = "powershell -ExecutionPolicy Bypass -File ./packaging/windows/build-offline.ps1", help = "build offline Windows Inno Setup installer into dist/" }
smoke-windows-installer-offline = { cmd = "powershell -ExecutionPolicy Bypass -File ./packaging/windows/smoke-offline.ps1", help = "smoke headless Windows install engine (or pass -InstallerExe)" }
generate-installer-icons = { cmd = "uv run python scripts/generate_installer_icons.py", help = "regenerate packaged square + installer icons from assets/icons/srxy.png" }
generate-macos-icons = { cmd = "uv run python scripts/generate_macos_icons.py", help = "regenerate squircle-masked macOS icons from assets/icons/srxy.png" }
checks = { cmd = "./scripts/quality/checks.sh", help = "run quality gate (day-to-day; Unix; auto-scope)" }
checks-fix = { cmd = "./scripts/quality/checks.sh --fix", help = "autofix then run quality gate (Unix)" }
checks-full = { cmd = "./scripts/quality/checks.sh --full", help = "full local quality gate (pre-release; Unix)" }
checks-full-cpu = { cmd = "./scripts/quality/checks.sh --full+cpu", help = "full gate + forced-CPU transcribe matrix (Unix)" }
checks-quiet = { cmd = "./scripts/quality/checks.sh --quiet", help = "run quality gate in agent-verbosity mode (Unix)" }
checks-fix-quiet = { cmd = "./scripts/quality/checks.sh --quiet --fix", help = "autofix then run quality gate, agent-verbosity (Unix)" }
checks-full-quiet = { cmd = "./scripts/quality/checks.sh --quiet --full", help = "full local quality gate, agent-verbosity (Unix)" }
checks-full-cpu-quiet = { cmd = "./scripts/quality/checks.sh --quiet --full+cpu", help = "full gate + forced-CPU matrix, agent-verbosity (Unix)" }
checks-core = { cmd = "./scripts/quality/checks.sh --scope=core", help = "quality gate: core bucket only (Unix)" }
checks-cli = { cmd = "./scripts/quality/checks.sh --scope=core", help = "quality gate: core/cli bucket (Unix)" }
checks-gui = { cmd = "./scripts/quality/checks.sh --scope=core,gui", help = "quality gate: core+gui (Unix)" }
checks-tui = { cmd = "./scripts/quality/checks.sh --scope=core,tui", help = "quality gate: core+tui (Unix)" }
checks-all = { cmd = "./scripts/quality/checks.sh --all", help = "quality gate: all buckets (Unix)" }
checks-core-quiet = { cmd = "./scripts/quality/checks.sh --quiet --scope=core", help = "core bucket, agent-verbosity (Unix)" }
checks-gui-quiet = { cmd = "./scripts/quality/checks.sh --quiet --scope=core,gui", help = "core+gui, agent-verbosity (Unix)" }
checks-tui-quiet = { cmd = "./scripts/quality/checks.sh --quiet --scope=core,tui", help = "core+tui, agent-verbosity (Unix)" }
checks-all-quiet = { cmd = "./scripts/quality/checks.sh --quiet --all", help = "all buckets, agent-verbosity (Unix)" }
checks-win = { cmd = "cmd /c scripts\\quality\\checks-win.cmd", help = "run quality gate (day-to-day; Windows; auto-scope)" }
checks-win-fix = { cmd = "cmd /c scripts\\quality\\checks-win.cmd -Fix", help = "autofix then run quality gate (Windows)" }
checks-win-full = { cmd = "cmd /c scripts\\quality\\checks-win.cmd -Full", help = "full local quality gate (pre-release; Windows)" }
checks-win-full-cpu = { cmd = "cmd /c scripts\\quality\\checks-win.cmd -FullCpu", help = "full gate + forced-CPU transcribe matrix (Windows)" }
checks-win-quiet = { cmd = "cmd /c scripts\\quality\\checks-win.cmd -Quiet", help = "run quality gate in agent-verbosity mode (Windows)" }
checks-win-fix-quiet = { cmd = "cmd /c scripts\\quality\\checks-win.cmd -Fix -Quiet", help = "autofix then run quality gate, agent-verbosity (Windows)" }
checks-win-full-quiet = { cmd = "cmd /c scripts\\quality\\checks-win.cmd -Full -Quiet", help = "full local quality gate, agent-verbosity (Windows)" }
checks-win-full-cpu-quiet = { cmd = "cmd /c scripts\\quality\\checks-win.cmd -FullCpu -Quiet", help = "full gate + forced-CPU matrix, agent-verbosity (Windows)" }
checks-win-core = { cmd = "cmd /c scripts\\quality\\checks-win.cmd -Scope core", help = "quality gate: core bucket only (Windows)" }
checks-win-cli = { cmd = "cmd /c scripts\\quality\\checks-win.cmd -Scope core", help = "quality gate: core/cli bucket (Windows)" }
checks-win-gui = { cmd = "cmd /c scripts\\quality\\checks-win.cmd -Scope core,gui", help = "quality gate: core+gui (Windows)" }
checks-win-tui = { cmd = "cmd /c scripts\\quality\\checks-win.cmd -Scope core,tui", help = "quality gate: core+tui (Windows)" }
checks-win-all = { cmd = "cmd /c scripts\\quality\\checks-win.cmd -All", help = "quality gate: all buckets (Windows)" }
checks-win-core-quiet = { cmd = "cmd /c scripts\\quality\\checks-win.cmd -Quiet -Scope core", help = "core bucket, agent-verbosity (Windows)" }
checks-win-gui-quiet = { cmd = "cmd /c scripts\\quality\\checks-win.cmd -Quiet -Scope core,gui", help = "core+gui, agent-verbosity (Windows)" }
checks-win-tui-quiet = { cmd = "cmd /c scripts\\quality\\checks-win.cmd -Quiet -Scope core,tui", help = "core+tui, agent-verbosity (Windows)" }
checks-win-all-quiet = { cmd = "cmd /c scripts\\quality\\checks-win.cmd -Quiet -All", help = "all buckets, agent-verbosity (Windows)" }
clear-models = { cmd = "./scripts/clear_models.sh", help = "clear cached model weights (optional target after --)" }
clear-cache = { cmd = "./scripts/clear_results_cache.sh", help = "clear results cache (cache.db)" }
bench = { cmd = "uv run python scripts/bench_file_search.py", help = "benchmark magic_file_search (flags after --)" }
export-api = { cmd = "uv run python scripts/docs/export_public_api.py", help = "regenerate docs/api-reference.md" }
export-tui-screenshot = { cmd = "./scripts/docs/export_tui_screenshot.sh", help = "regenerate TUI docs screenshot" }
export-gui-screenshot = { cmd = "./scripts/docs/export_gui_screenshot.sh", help = "regenerate per-OS GUI docs screenshot (gui-macos/linux/windows.png)" }
export-installer-screenshot = { cmd = "./scripts/docs/export_installer_screenshot.sh", help = "regenerate offline installer docs screenshot" }
export-installer-online-screenshot = { cmd = "./scripts/docs/export_installer_online_screenshot.sh", help = "regenerate online web installer docs screenshot" }
upload = { cmd = "./scripts/upload.sh", help = "upload to PyPI (flags after --)" }
test-package = { cmd = "./scripts/test-package.sh", help = "install from PyPI into a fresh venv and smoke-test" }
format = { cmd = "uv run ruff check --fix src tests && uv run ruff format src tests", help = "format code" }
