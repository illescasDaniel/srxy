name: macOS Installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: macos-installer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-offline:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packaging/online-bootstrap/go.mod
          cache: false

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Build offline macOS installer app
        run: ./packaging/macos/build-offline.sh

      - name: Smoke test offline app
        run: ./packaging/macos/smoke-offline.sh

      - name: Upload offline macOS installer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: srxy-installer-offline-macos-${{ github.sha }}
          path: |
            dist/*.app
            dist/srxy-*-installer-*-*.dmg
            dist/srxy-*-installer-*-*.sha256
            dist/SHA256SUMS-macos-offline
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && 90 || 7 }}

  build-online:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packaging/online-bootstrap/go.mod
          cache: false

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Build online macOS installer app
        run: ./packaging/macos/build-online.sh

      - name: Smoke test online app
        run: ./packaging/macos/smoke-online.sh

      - name: Upload online macOS installer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: srxy-installer-online-macos-${{ github.sha }}
          path: |
            dist/*.app
            dist/srxy-*-installer-online-*-*.dmg
            dist/srxy-*-installer-online-*-*.sha256
            dist/SHA256SUMS-macos-online
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && 90 || 7 }}

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [build-offline, build-online]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download offline artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: srxy-installer-offline-macos-${{ github.sha }}
          path: dist

      - name: Download online artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: srxy-installer-online-macos-${{ github.sha }}
          path: dist

      - name: Attach macOS installers to GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/*.dmg
            dist/SHA256SUMS-macos-offline
            dist/SHA256SUMS-macos-online
            dist/*.sha256
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
