name: CI

on:
  push:
    branches: [main, feature/tui]
  pull_request:
    branches: [main, feature/tui]

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Install shell linting tools
        run: |
          sudo apt-get install -y shellcheck shfmt

      - name: Quality gate
        env:
          CI: true
          GITHUB_ACTIONS: true
        run: ./scripts/quality/checks.sh

  test-macos:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Unit tests
        env:
          CI: true
        run: uv run pytest tests -n auto -m "unit and not semantic and not transcribe"

  test-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen --extra windows

      - name: Unit tests
        env:
          CI: true
        run: uv run pytest tests -n auto -m "unit and not semantic and not transcribe"
