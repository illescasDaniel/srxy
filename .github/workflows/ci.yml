name: CI

on:
  push:
    branches: [main, feature/tui, feature/gui]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Install shell linting tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0

      - name: Quality gate
        env:
          CI: true
          GITHUB_ACTIONS: true
          QT_QPA_PLATFORM: offscreen
        run: ./scripts/quality/checks.sh

  test-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Unit tests
        env:
          CI: true
          QT_QPA_PLATFORM: offscreen
        # max-worker-restart=0: a crashed Qt/xdist worker fails fast instead of
        # hanging while trying to replace the node ("Not properly terminated").
        run: uv run pytest tests -n auto --dist=loadgroup --max-worker-restart=0 -m "unit and not semantic and not transcribe"

  test-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Sync dependencies
        run: uv sync --frozen --extra windows

      - name: Unit tests
        env:
          CI: true
          QT_QPA_PLATFORM: offscreen
        # max-worker-restart=0: a crashed Qt/xdist worker fails fast instead of
        # hanging while trying to replace the node ("Not properly terminated").
        run: uv run pytest tests -n auto --dist=loadgroup --max-worker-restart=0 -m "unit and not semantic and not transcribe"
