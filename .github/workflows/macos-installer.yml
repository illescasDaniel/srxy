name: macOS Installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: macos-installer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-offline:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: packaging/online-bootstrap/go.mod
          cache: false

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Build offline macOS installer app
        run: ./packaging/macos/build-offline.sh

      - name: Smoke test offline app
        run: ./packaging/macos/smoke-offline.sh

      - name: Upload offline macOS installer artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: srxy-installer-offline-macos-${{ github.sha }}
          path: |
            dist/*.app
            dist/srxy-*-installer-*-*.dmg
            dist/srxy-*-installer-*-*.sha256
            dist/SHA256SUMS-macos-offline
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && 90 || 7 }}

  build-online:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: packaging/online-bootstrap/go.mod
          cache: false

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Build online macOS installer app
        run: ./packaging/macos/build-online.sh

      - name: Smoke test online app
        run: ./packaging/macos/smoke-online.sh

      - name: Upload online macOS installer artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: srxy-installer-online-macos-${{ github.sha }}
          path: |
            dist/*.app
            dist/srxy-*-installer-online-*-*.dmg
            dist/srxy-*-installer-online-*-*.sha256
            dist/SHA256SUMS-macos-online
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && 90 || 7 }}

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [build-offline, build-online]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download offline artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: srxy-installer-offline-macos-${{ github.sha }}
          path: dist

      - name: Download online artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: srxy-installer-online-macos-${{ github.sha }}
          path: dist

      - name: Attach macOS installers to GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            dist/*.dmg
            dist/SHA256SUMS-macos-offline
            dist/SHA256SUMS-macos-online
            dist/*.sha256
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
