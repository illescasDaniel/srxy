name: AppImage

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: appimage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0

      - name: Build offline installer AppImage
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./packaging/linux-appimage/build.sh

      - name: Smoke test offline AppImage
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./packaging/linux-appimage/smoke-appimage.sh

      - name: Upload offline AppImage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: srxy-installer-appimage-${{ github.sha }}
          path: |
            dist/srxy-*-installer-*-x86_64.AppImage.xz
            !dist/srxy-*-installer-online-*-x86_64.AppImage.xz
            dist/SHA256SUMS
            dist/*.sha256
            !dist/*-installer-online-*.sha256
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && 90 || 7 }}

  build-online:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: packaging/online-bootstrap/go.mod
          # Bootstrap module has no third-party deps (no go.sum); skip cache lookup noise.
          cache: false

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Build online installer AppImage
        run: ./packaging/linux-appimage/build-online.sh

      - name: Smoke test online AppImage
        run: ./packaging/linux-appimage/smoke-appimage-online.sh

      - name: Upload online AppImage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: srxy-installer-online-appimage-${{ github.sha }}
          path: |
            dist/srxy-*-installer-online-*-x86_64.AppImage.xz
            dist/SHA256SUMS-online
            dist/*-installer-online-*.sha256
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && 90 || 7 }}

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [build, build-online]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download offline AppImage artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: srxy-installer-appimage-${{ github.sha }}
          path: dist

      - name: Download online AppImage artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: srxy-installer-online-appimage-${{ github.sha }}
          path: dist

      - name: Attach AppImages to GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            dist/srxy-*-installer-*-x86_64.AppImage.xz
            dist/SHA256SUMS
            dist/SHA256SUMS-online
            dist/*.sha256
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
