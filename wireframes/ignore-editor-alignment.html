<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>srxy — Ignore editor alignment review</title>
<style>
	:root { color-scheme:light dark; --bg:#f4f5f7; --panel:#fff; --ink:#1d2330; --muted:#667085; --line:#d0d5dd; --accent:#2f6fed; --error:#c62828; --review:#fff6e0; }
	@media (prefers-color-scheme:dark) { :root { --bg:#15181f; --panel:#20242e; --ink:#e6e9f0; --muted:#a5aebd; --line:#596171; --error:#ff8b85; --review:#3a3217; } }
	* { box-sizing:border-box; }
	body { margin:0; padding:24px 16px 48px; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui,sans-serif; }
	main { max-width:1040px; margin:auto; }
	h1 { margin:0 0 4px; font-size:22px; }
	.subtitle { margin:0 0 16px; color:var(--muted); }
	.review { margin:16px 0 24px; padding:12px 14px; border:1px dashed #b88b20; border-radius:8px; background:var(--review); }
	.review strong { font-size:12px; }
	.review p { margin:4px 0 0; }
	.examples { display:flex; flex-wrap:wrap; align-items:flex-start; gap:24px 20px; }
	figure { margin:0; width:500px; max-width:100%; }
	figure.narrow { width:340px; }
	figcaption { margin:8px 2px 0; font-size:12px; color:var(--muted); }
	.dialog { background:var(--panel); border:1px solid var(--line); border-radius:10px; box-shadow:0 8px 24px #0002; overflow:hidden; }
	h2 { margin:0; padding:12px 16px; border-bottom:1px solid var(--line); font-size:15px; }
	.body { padding:12px 16px; display:grid; gap:8px; }
	.section { font-weight:600; }
	.editor-label { display:flex; justify-content:space-between; align-items:center; font-weight:500; }
	.info { width:18px; height:18px; border:1px solid var(--line); border-radius:50%; color:var(--muted); text-align:center; font-size:11px; line-height:16px; }
	textarea { display:block; width:100%; height:104px; min-height:104px; margin:0; padding:12px; border:1px solid var(--line); border-radius:6px; background:var(--panel); color:var(--ink); font:13px/20px ui-monospace,monospace; text-align:left; resize:none; overflow:auto; white-space:pre; }
	textarea::placeholder { color:var(--muted); opacity:1; font:inherit; }
	textarea:focus { outline:2px solid var(--accent); outline-offset:2px; }
	textarea.invalid { border-color:var(--error); }
	.hint { color:var(--muted); font-size:12px; }
	.error { color:var(--error); font-size:12px; }
	.buttons { display:flex; flex-wrap:wrap; gap:6px; }
	button { padding:5px 12px; border:1px solid var(--line); border-radius:6px; background:transparent; color:inherit; font:inherit; }
	.footer { padding:10px 16px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:8px; }
	.primary { border-color:var(--accent); background:var(--accent); color:#fff; }
	button:disabled { opacity:.45; }
</style>
</head>
<body>
<main>
	<h1>Ignore editor alignment</h1>
	<p class="subtitle">GUI Filters dialog · editor detail · design review</p>
	<aside class="review"><strong>Review only</strong><p>Placeholder visible only when empty. Use the same padding and first-line baseline when typing: 12px inset, 13px text, 20px line height inside a 104px outlined editor. Retain scrolling.</p></aside>
	<div class="examples">
		<figure>
			<section class="dialog" aria-label="Empty Filters example">
				<h2>Filters</h2>
				<div class="body">
					<div class="section">Which files to scan</div>
					<label class="editor-label" for="empty">Ignore files &amp; folders <span class="info" aria-hidden="true">i</span></label>
					<textarea id="empty" spellcheck="false" placeholder="e.g. node_modules/ or *.log" aria-describedby="empty-hint"></textarea>
					<div class="hint" id="empty-hint">One pattern per line. Gitignore-style: * ** / anchor, trailing / = folders only, ! re-includes, # comment.</div>
					<div class="buttons"><button type="button">Add file…</button><button type="button">Add folder…</button></div>
				</div>
				<div class="footer"><button type="button">Cancel</button><button type="button" class="primary">OK</button></div>
			</section>
			<figcaption>Empty — placeholder begins at the top inset. Type here to check that it disappears.</figcaption>
		</figure>
		<figure>
			<section class="dialog" aria-label="Filled Filters example">
				<h2>Filters</h2>
				<div class="body">
					<div class="section">Which files to scan</div>
					<label class="editor-label" for="filled">Ignore files &amp; folders <span class="info" aria-hidden="true">i</span></label>
					<textarea id="filled" spellcheck="false" placeholder="e.g. node_modules/ or *.log" aria-describedby="filled-hint">node_modules/
*.log</textarea>
					<div class="hint" id="filled-hint">One pattern per line. Gitignore-style: * ** / anchor, trailing / = folders only, ! re-includes, # comment.</div>
					<div class="buttons"><button type="button">Add file…</button><button type="button">Add folder…</button></div>
				</div>
				<div class="footer"><button type="button">Cancel</button><button type="button" class="primary">OK</button></div>
			</section>
			<figcaption>Filled — first pattern shares the placeholder’s inset and baseline; no placeholder is visible.</figcaption>
		</figure>
		<figure class="narrow">
			<section class="dialog" aria-label="Narrow filled Filters example">
				<h2>Filters</h2>
				<div class="body">
					<div class="section">Which files to scan</div>
					<label class="editor-label" for="narrow">Ignore files &amp; folders <span class="info" aria-hidden="true">i</span></label>
					<textarea id="narrow" spellcheck="false" placeholder="e.g. node_modules/ or *.log" aria-describedby="narrow-hint">node_modules/
*.log</textarea>
					<div class="hint" id="narrow-hint">One pattern per line. Gitignore-style: * ** / anchor, trailing / = folders only, ! re-includes, # comment.</div>
					<div class="buttons"><button type="button">Add file…</button><button type="button">Add folder…</button></div>
				</div>
				<div class="footer"><button type="button">Cancel</button><button type="button" class="primary">OK</button></div>
			</section>
			<figcaption>Narrow — same editor height and text metrics; hint wraps below the editor.</figcaption>
		</figure>
		<figure>
			<section class="dialog" aria-label="Invalid pattern Filters example">
				<h2>Filters</h2>
				<div class="body">
					<div class="section">Which files to scan</div>
					<label class="editor-label" for="invalid">Ignore files &amp; folders <span class="info" aria-hidden="true">i</span></label>
					<textarea id="invalid" class="invalid" spellcheck="false" aria-invalid="true" aria-describedby="pattern-error invalid-hint">*.log
[unclosed</textarea>
					<div class="error" id="pattern-error">Line 2: unclosed “[” in pattern. Fix it to continue.</div>
					<div class="hint" id="invalid-hint">One pattern per line. Gitignore-style: * ** / anchor, trailing / = folders only, ! re-includes, # comment.</div>
					<div class="buttons"><button type="button">Add file…</button><button type="button">Add folder…</button></div>
				</div>
				<div class="footer"><button type="button">Cancel</button><button type="button" class="primary" disabled>OK</button></div>
			</section>
			<figcaption>Error — existing red outline, line-specific message, and disabled OK; text inset stays consistent.</figcaption>
		</figure>
	</div>
</main>
</body>
</html>
