name: Windows Installer

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: windows-installer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-offline:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Probe installer catalog URLs
        run: uv run python -m srxy.adapters.inbound.installer.probe_catalog

      - name: Build offline Windows PySide installer
        shell: pwsh
        run: .\packaging\windows\build-offline.ps1

      - name: Smoke fat SrxyInstaller.exe
        shell: pwsh
        run: .\packaging\windows\smoke-offline.ps1

      - name: Upload offline Windows installer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: srxy-installer-offline-windows-${{ github.sha }}
          path: |
            dist/srxy-*-installer-*-x86_64.zip
            dist/srxy-*-installer-*-x86_64.zip.sha256
            dist/SHA256SUMS-windows-offline
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && 90 || 7 }}

  release-attach:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [build-offline]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download offline artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: srxy-installer-offline-windows-${{ github.sha }}
          path: dist

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/srxy-*-installer-*-x86_64.zip
            dist/srxy-*-installer-*-x86_64.zip.sha256
            dist/SHA256SUMS-windows-offline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
