name: AppImage

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: appimage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0

      - name: Build offline installer AppImage
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./packaging/linux-appimage/build.sh

      - name: Smoke test offline AppImage
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./packaging/linux-appimage/smoke-appimage.sh

      - name: Upload offline AppImage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: srxy-installer-appimage-${{ github.sha }}
          path: |
            dist/srxy-*-installer-*-x86_64.AppImage.xz
            !dist/srxy-*-installer-online-*-x86_64.AppImage.xz
            dist/SHA256SUMS
            dist/*.sha256
            !dist/*-installer-online-*.sha256
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && 90 || 7 }}

  build-online:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packaging/online-bootstrap/go.mod
          # Bootstrap module has no third-party deps (no go.sum); skip cache lookup noise.
          cache: false

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Build online installer AppImage
        run: ./packaging/linux-appimage/build-online.sh

      - name: Smoke test online AppImage
        run: ./packaging/linux-appimage/smoke-appimage-online.sh

      - name: Upload online AppImage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: srxy-installer-online-appimage-${{ github.sha }}
          path: |
            dist/srxy-*-installer-online-*-x86_64.AppImage.xz
            dist/SHA256SUMS-online
            dist/*-installer-online-*.sha256
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && 90 || 7 }}

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [build, build-online]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download offline AppImage artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: srxy-installer-appimage-${{ github.sha }}
          path: dist

      - name: Download online AppImage artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: srxy-installer-online-appimage-${{ github.sha }}
          path: dist

      - name: Attach AppImages to GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/srxy-*-installer-*-x86_64.AppImage.xz
            dist/SHA256SUMS
            dist/SHA256SUMS-online
            dist/*.sha256
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
