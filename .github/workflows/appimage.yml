name: AppImage

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: appimage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Build offline installer AppImage
        run: ./packaging/linux-appimage/build.sh

      - name: Smoke test offline AppImage
        run: ./packaging/linux-appimage/smoke-appimage.sh

      - name: Upload offline AppImage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: srxy-installer-appimage-${{ github.sha }}
          path: |
            dist/srxy-*-installer-*-x86_64.AppImage
            !dist/srxy-*-installer-online-*-x86_64.AppImage
            dist/SHA256SUMS
            dist/*.sha256
            !dist/*-installer-online-*.sha256
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && 90 || 7 }}

  build-online:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - uses: actions/setup-go@d60b41a563a30e4f8bf4f36e2b24f7fc42ca7dc5 # v5.5.0
        with:
          go-version: "1.22"

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Build online installer AppImage
        run: ./packaging/linux-appimage/build-online.sh

      - name: Smoke test online AppImage
        run: ./packaging/linux-appimage/smoke-appimage-online.sh

      - name: Upload online AppImage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: srxy-installer-online-appimage-${{ github.sha }}
          path: |
            dist/srxy-*-installer-online-*-x86_64.AppImage
            dist/SHA256SUMS-online
            dist/*-installer-online-*.sha256
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && 90 || 7 }}

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [build, build-online]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download offline AppImage artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: srxy-installer-appimage-${{ github.sha }}
          path: dist

      - name: Download online AppImage artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: srxy-installer-online-appimage-${{ github.sha }}
          path: dist

      - name: Attach AppImages to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/srxy-*-installer-*-x86_64.AppImage
            dist/SHA256SUMS
            dist/SHA256SUMS-online
            dist/*.sha256
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
