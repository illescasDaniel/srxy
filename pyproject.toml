[project]
name = "srxy"
version = "1.6.0"
description = "Find files by what you mean — from the terminal or Python."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
	"cryptography>=44.0",
	"exifread>=3.5",
	"jellyfish>=1.2",
	"mutagen>=1.48",
	"openpyxl>=3.1",
	"pillow>=12.3",
	"pillow-heif>=1.4",
	"pypdf>=6.14",
	"pytesseract>=0.3",
	"PySide6>=6.6",
	"python-docx>=1.2",
	"python-pptx>=1.0",
	"rapidfuzz>=3.14",
	"textual>=3.0",
	"wordfreq>=3.1",
]

[project.optional-dependencies]
# Text + image semantic search (sentence-transformers → PyTorch, CLIP, MiniLM).
semantic = [
	"faster-whisper>=1.2",
	"nvidia-cublas-cu12; platform_system == 'Linux' or platform_system == 'Windows'",
	"rawpy>=0.27",
	"sentence-transformers>=5.6",
]
windows = [
	"pywin32>=312",
]

[dependency-groups]
dev = [
	"basedpyright>=1.39",
	"pip-audit>=2.10",
	"pytest>=9.1",
	"pytest-cov>=7.1",
	"pytest-qt>=4.4",
	"pytest-testmon>=2.2",
	"pytest-xdist>=3.6",
	"ruff>=0.15",
	"taskipy>=1.14",
]
uploader = [
	"twine>=6.2",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[project.scripts]
srxy = "srxy.__main__:main"
srxy-installer = "srxy.adapters.inbound.installer.__main__:main"

# tests/ (including tests/fixtures/file_search/) are dev-only and not packaged in the wheel.

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short -rs"
pythonpath = ["."]
qt_api = "pyside6"
filterwarnings = [
	"ignore:.*BPE.__init__ will not create from files anymore:DeprecationWarning",
]
markers = [
	"unit: fast isolated tests",
	"integration: tests using real models and fixture datasets",
	"tui: Textual TUI display and interaction tests",
	"gui: PySide6 GUI display and interaction tests",
	"ocr: tests requiring a real OCR backend",
	"linux_xattr: tests that require Linux extended attribute support",
	"macos_finder: tests that require writable macOS Finder tag extended attributes",
	"windows_tags: tests that require Windows Explorer tag support via pywin32",
	"transcribe: tests requiring faster-whisper, transformers, and ffmpeg",
	"semantic: tests requiring uv tool install 'srxy[semantic]' (torch, sentence-transformers, etc.)",
	"integration_full: extended integration tests using committed binary fixtures from tests/fixtures/file_search/",
	"transcribe_device_matrix: parametrized transcribe device matrix (CUDA only when available; use --integration-test-cpu to force CPU too)",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.format]
indent-style = "tab"

[tool.ruff.lint]
select = ["F", "I", "E", "S", "B"]
fixable = ["ALL"]
ignore = ["E501"]

[tool.ruff.lint.isort]
combine-as-imports = true
lines-after-imports = 2

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["S603", "S607"]
"tests/**" = ["S101"]
"tests/integration/test_file_search_fixtures.py" = ["S603", "S607"]
"tests/tui/test_qa_integration.py" = ["S108"]

[tool.basedpyright]
typeCheckingMode = "strict"
include = ["src", "tests"]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
reportMissingTypeStubs = false
reportMissingModuleSource = false
reportUnknownMemberType = false
reportUnknownLambdaType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportAttributeAccessIssue = false
executionEnvironments = [
	{ root = "src/srxy/adapters/outbound/metadata/windows_metadata.py", reportMissingModuleSource = "none", reportMissingImports = "none" },
	{ root = "src/srxy/adapters/outbound/models/device.py", reportMissingImports = "none" },
	{ root = "src/srxy/adapters/outbound/semantic/semantic_image.py", reportMissingImports = "none" },
	{ root = "src/srxy/application/matching/semantic.py", reportMissingImports = "none" },
	{ root = "tests/unit/test_semantic_cache.py", reportMissingImports = "none" },
	{ root = "tests/unit/test_windows_metadata.py", reportPrivateUsage = "none" },
	{ root = "src" },
	{ root = "tests", extraPaths = ["src", "."] },
]

[tool.coverage.run]
source = ["srxy"]
omit = ["tests/*"]

[tool.taskipy.tasks]
cli = { cmd = "uv run srxy --cli", help = "launch plain CLI (pass query/path/flags after --)" }
tui = { cmd = "uv run srxy --tui", help = "launch Textual TUI (pass query/path/flags after --)" }
gui = { cmd = "uv run srxy", help = "launch GUI (pass query/path/flags after --)" }
gui-bare = { cmd = "./scripts/gui-bare.sh", help = "GUI from core-only .venv-bare (no semantic extras; --recreate to rebuild)" }
installer = { cmd = "uv run srxy-installer", help = "launch desktop install/uninstall wizard" }
build-appimage = { cmd = "./packaging/linux-appimage/build.sh", help = "build Linux installer AppImage into dist/" }
checks = { cmd = "./scripts/quality/checks.sh", help = "run quality gate (day-to-day)" }
checks-fix = { cmd = "./scripts/quality/checks.sh --fix", help = "autofix then run quality gate" }
checks-full = { cmd = "./scripts/quality/checks.sh --full", help = "full local quality gate (pre-release)" }
checks-full-cpu = { cmd = "./scripts/quality/checks.sh --full+cpu", help = "full gate + forced-CPU transcribe matrix" }
clear-models = { cmd = "./scripts/clear_models.sh", help = "clear cached model weights (optional target after --)" }
clear-cache = { cmd = "./scripts/clear_results_cache.sh", help = "clear results cache (cache.db)" }
bench = { cmd = "uv run python scripts/bench_file_search.py", help = "benchmark magic_file_search (flags after --)" }
export-api = { cmd = "uv run python scripts/docs/export_public_api.py", help = "regenerate docs/api-reference.md" }
export-tui-screenshot = { cmd = "./scripts/docs/export_tui_screenshot.sh", help = "regenerate TUI docs screenshot" }
export-gui-screenshot = { cmd = "./scripts/docs/export_gui_screenshot.sh", help = "regenerate GUI docs screenshot" }
export-installer-screenshot = { cmd = "./scripts/docs/export_installer_screenshot.sh", help = "regenerate installer docs screenshot" }
upload = { cmd = "./scripts/upload.sh", help = "upload to PyPI (flags after --)" }
test-package = { cmd = "./scripts/test-package.sh", help = "install from PyPI into a fresh venv and smoke-test" }
format = { cmd = "uv run ruff check --fix src tests && uv run ruff format src tests", help = "format code" }
